<script type="text/javascript">
function setDomainPhpResetState(fieldId, pending) {
  var reset = document.getElementById(fieldId + '-reset');
  var pendingMessage = document.getElementById(fieldId + '-reset-pending');
  var resetAction = document.getElementById(fieldId + '-reset-action');
  if (reset) reset.value = pending ? 'yes' : 'no';
  if (pendingMessage) pendingMessage.style.display = pending ? 'inline' : 'none';
  if (resetAction) resetAction.style.display = pending ? 'none' : 'inline';
}

function cancelDomainPhpReset(fieldId) {
  setDomainPhpResetState(fieldId, false);
}

function useDomainPhpSuggestion(fieldId) {
  var field = document.getElementById(fieldId);
  var suggested = document.getElementById(fieldId + '-suggested');
  if (!field || !suggested) return;
  field.value = suggested.value;
  setDomainPhpResetState(fieldId, false);
  field.focus();
}

function resetDomainPhpSetting(fieldId) {
  var field = document.getElementById(fieldId);
  var base = document.getElementById(fieldId + '-base');
  if (!field || !base) return;
  field.value = base.value;
  setDomainPhpResetState(fieldId, true);
  field.focus();
}

function undoDomainPhpReset(fieldId) {
  var field = document.getElementById(fieldId);
  var actual = document.getElementById(fieldId + '-actual');
  if (!field || !actual) return;
  field.value = actual.value;
  setDomainPhpResetState(fieldId, false);
  field.focus();
}
</script>
